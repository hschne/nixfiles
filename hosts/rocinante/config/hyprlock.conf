# Bork supplies break state; Hyprlock owns authentication and layout.

background {
    monitor =
    path = /home/hschne/.local/share/bork/intermission.png
    color = rgba(111718ff)
    blur_passes = 0
    noise = 0
    contrast = 1
    brightness = 1
    vibrancy = 0
}

label {
    monitor =
    text = cmd[update:1000] /home/hschne/.local/bin/bork status 2>/dev/null | /run/current-system/sw/bin/jq -ers 'def pad: tostring | if length < 2 then "0" + . else . end; .[0] | if .state == "resting" then "BREAK COMPLETE" elif .state == "paused" then "BORK PAUSED" elif .state == "stopped" then "BORK STOPPED" elif .state == "running" and (.break_remaining_seconds | type) == "number" then .break_remaining_seconds | "\(. / 60 | floor | pad):\(. % 60 | pad) LEFT" else error("Invalid status") end' 2>/dev/null || printf 'BORK UNAVAILABLE\n'
    color = rgba(d9e8b2ff)
    font_family = SauceCodePro NF
    font_size = 24
    position = 0, -10%
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.5
    dots_center = true
    outer_color = rgba(bb9af7ff)
    inner_color = rgba(1a1b26ff)
    font_color = rgba(a9b1d6ff)
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, -29%
    halign = center
    valign = center
    check_color = rgba(9ece6aff)
    fail_color = rgba(f7768eff)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
}

label {
    monitor =
    text = $TIME
    color = rgba(111718ff)
    font_size = 36
    font_family = SauceCodePro NF
    position = 0, 37%
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(111718ff)
    font_size = 20
    font_family = SauceCodePro NF
    position = 0, 29%
    halign = center
    valign = center
}
